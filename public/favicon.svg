<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2F4D"/>
      <stop offset="100%" stop-color="#0F1724"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Main white card (slightly inset for subtle depth) -->
  <circle cx="256" cy="256" r="176" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Skyline buildings -->
  <g fill="#16243A">
    <!-- Left building -->
    <rect x="180" y="155" width="42" height="82" rx="6"/>
    <!-- Center building -->
    <rect x="235" y="125" width="46" height="112" rx="6"/>
    <!-- Right building -->
    <rect x="294" y="168" width="40" height="69" rx="6"/>
  </g>

  <!-- Windows - Left building -->
  <g fill="#A0B4D0" opacity="0.7">
    <rect x="188" y="165" width="8" height="8" rx="2"/>
    <rect x="202" y="165" width="8" height="8" rx="2"/>
    <rect x="188" y="179" width="8" height="8" rx="2"/>
    <rect x="202" y="179" width="8" height="8" rx="2"/>
    <rect x="188" y="193" width="8" height="8" rx="2"/>
    <rect x="202" y="193" width="8" height="8" rx="2"/>
    <rect x="188" y="207" width="8" height="8" rx="2"/>
    <rect x="202" y="207" width="8" height="8" rx="2"/>
  </g>

  <!-- Windows - Center building -->
  <g fill="#A0B4D0" opacity="0.7">
    <rect x="247" y="136" width="8" height="8" rx="2"/>
    <rect x="261" y="136" width="8" height="8" rx="2"/>
    <rect x="247" y="150" width="8" height="8" rx="2"/>
    <rect x="261" y="150" width="8" height="8" rx="2"/>
    <rect x="247" y="164" width="8" height="8" rx="2"/>
    <rect x="261" y="164" width="8" height="8" rx="2"/>
    <rect x="247" y="178" width="8" height="8" rx="2"/>
    <rect x="261" y="178" width="8" height="8" rx="2"/>
    <rect x="247" y="192" width="8" height="8" rx="2"/>
    <rect x="261" y="192" width="8" height="8" rx="2"/>
    <rect x="247" y="206" width="8" height="8" rx="2"/>
    <rect x="261" y="206" width="8" height="8" rx="2"/>
  </g>

  <!-- Door - Center building -->
  <rect x="250" y="216" width="16" height="21" rx="3" fill="#0F1724"/>
  <circle cx="262" cy="227" r="2" fill="#A0B4D0"/>

  <!-- Windows - Right building -->
  <g fill="#A0B4D0" opacity="0.7">
    <rect x="302" y="178" width="8" height="8" rx="2"/>
    <rect x="316" y="178" width="8" height="8" rx="2"/>
    <rect x="302" y="192" width="8" height="8" rx="2"/>
    <rect x="316" y="192" width="8" height="8" rx="2"/>
    <rect x="302" y="206" width="8" height="8" rx="2"/>
    <rect x="316" y="206" width="8" height="8" rx="2"/>
  </g>

  <!-- Divider -->
  <line x1="190" y1="270" x2="322" y2="270"
        stroke="#D6DCE5"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="256"
        y="340"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42"
        font-weight="600"
        letter-spacing="0.5"
        fill="#16243A">
    InfraLicence
  </text>
</svg>
